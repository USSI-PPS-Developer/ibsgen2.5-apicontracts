name: 🚀 Build & Deploy IBSGen 2.5 Docs (MkDocs + Auto-Nav)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: 🧩 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: ⚙️ Install dependencies
        run: |
          pip install mkdocs mkdocs-material pyyaml

      - name: 📘 Generate API Markdown (fast)
        run: |
          make docs-fast

      - name: 🧭 Auto-generate MkDocs navigation
        run: |
          make docs-nav

      - name: 🏗️ Build MkDocs site
        run: |
          mkdocs build -f mkdocs.yml -d site

      - name: 🚀 Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site